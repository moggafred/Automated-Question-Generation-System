<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AQG — AI-Powered Assessment &amp; Study Platform</title>
  <meta
    name="description"
    content="Upload learning material and turn it into grounded assessments, study resources and real performance insight with retrieval-augmented AI."
  />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Applied before first paint so the theme never flashes the wrong palette.
    (function () {
      try {
        var stored = localStorage.getItem('aqg.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      } catch (error) {
        /* Private mode: fall back to the light default already on <html>. */
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="sidebar__brand" href="#/dashboard" aria-label="AQG home">
        <span class="sidebar__logo" id="brand-logo" aria-hidden="true">AQ</span>
        <span class="sidebar__wordmark">
          <span class="sidebar__name" data-app-name>AQG</span>
          <span class="sidebar__tagline" data-app-tagline>Assessment &amp; Study</span>
        </span>
      </a>

      <div class="sidebar__section">
        <p class="sidebar__section-label">Workspace</p>
        <nav class="sidebar__nav" id="primary-nav">
          <a class="nav-link" href="#/dashboard" data-nav="dashboard" data-icon="dashboard">
            <span class="nav-link__icon" data-icon-slot></span><span>Dashboard</span>
          </a>
          <a class="nav-link" href="#/generate" data-nav="generate" data-icon="generate">
            <span class="nav-link__icon" data-icon-slot></span><span>Generate</span>
          </a>
          <a class="nav-link" href="#/study" data-nav="study" data-icon="study">
            <span class="nav-link__icon" data-icon-slot></span><span>Study Materials</span>
          </a>
          <a class="nav-link" href="#/history" data-nav="history" data-icon="history">
            <span class="nav-link__icon" data-icon-slot></span><span>History</span>
          </a>
          <a class="nav-link" href="#/assessments" data-nav="assessments" data-icon="assessment">
            <span class="nav-link__icon" data-icon-slot></span><span>Assessments</span>
          </a>
          <a class="nav-link" href="#/performance" data-nav="performance" data-icon="performance">
            <span class="nav-link__icon" data-icon-slot></span><span>Performance</span>
          </a>
        </nav>
      </div>

      <div class="sidebar__section">
        <p class="sidebar__section-label">Library</p>
        <nav class="sidebar__nav" id="secondary-nav">
          <a class="nav-link" href="#/documents" data-nav="documents" data-icon="file">
            <span class="nav-link__icon" data-icon-slot></span><span>Documents</span>
          </a>
        </nav>
      </div>

      <div class="sidebar__section">
        <p class="sidebar__section-label">Account</p>
        <nav class="sidebar__nav" id="tertiary-nav">
          <a class="nav-link" href="#/settings" data-nav="settings" data-icon="settings">
            <span class="nav-link__icon" data-icon-slot></span><span>Settings</span>
          </a>
          <a class="nav-link" href="#/help" data-nav="help" data-icon="help">
            <span class="nav-link__icon" data-icon-slot></span><span>Help &amp; Guide</span>
          </a>
        </nav>
      </div>

      <div class="sidebar__footer">
        <p class="sidebar__status" id="sidebar-status">
          <span class="status-dot" data-state="pending" aria-hidden="true"></span>
          <span>Connecting…</span>
        </p>
        <button type="button" class="sidebar__collapse" id="sidebar-collapse" data-icon="chevronLeft">
          <span class="nav-link__icon" data-icon-slot aria-hidden="true"></span><span>Collapse</span>
        </button>
      </div>
    </aside>

    <header class="topbar">
      <button type="button" class="topbar__menu" id="drawer-toggle" aria-label="Open navigation" aria-expanded="false">
        <span data-icon-slot="menu"></span>
      </button>

      <div class="topbar__heading">
        <p class="topbar__title" id="page-title">Dashboard</p>
        <p class="topbar__breadcrumb" id="page-breadcrumb">Overview</p>
      </div>

      <div class="topbar__search">
        <span class="topbar__search-icon" data-icon-slot="search" aria-hidden="true"></span>
        <label class="visually-hidden" for="global-search">Search your history</label>
        <input
          class="input"
          id="global-search"
          type="search"
          placeholder="Search history…"
          autocomplete="off"
        />
      </div>

      <div class="topbar__actions">
        <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch to dark theme">
          <span data-icon-slot="moon" aria-hidden="true"></span>
        </button>
        <a class="icon-button" href="#/help" aria-label="Open help and guide">
          <span data-icon-slot="help" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <main class="main" id="main-content" tabindex="-1">
      <div class="page" id="page-root" aria-live="polite" aria-busy="true">
        <div class="card">
          <div class="card__body">
            <div class="loading-panel">
              <span class="spinner spinner--lg" aria-hidden="true"></span>
              <p class="loading-panel__title">Loading AQG</p>
              <p class="loading-panel__text">Preparing your workspace…</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Primary">
      <a class="mobile-nav__link" href="#/dashboard" data-nav="dashboard" data-icon="dashboard">
        <span data-icon-slot aria-hidden="true"></span><span>Dashboard</span>
      </a>
      <a class="mobile-nav__link" href="#/generate" data-nav="generate" data-icon="generate">
        <span data-icon-slot aria-hidden="true"></span><span>Generate</span>
      </a>
      <a class="mobile-nav__link" href="#/study" data-nav="study" data-icon="study">
        <span data-icon-slot aria-hidden="true"></span><span>Study</span>
      </a>
      <a class="mobile-nav__link" href="#/history" data-nav="history" data-icon="history">
        <span data-icon-slot aria-hidden="true"></span><span>History</span>
      </a>
      <a class="mobile-nav__link" href="#/performance" data-nav="performance" data-icon="performance">
        <span data-icon-slot aria-hidden="true"></span><span>Progress</span>
      </a>
    </nav>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  </div>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <noscript>
    <div class="state" style="padding: 2rem">
      <p class="state__title">JavaScript is required</p>
      <p class="state__text">
        AQG renders assessments, study materials and analytics in the browser. Please enable
        JavaScript to continue.
      </p>
    </div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
